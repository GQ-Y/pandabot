<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Pandabot Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
              },
              secondary: {
                50: '#eef2ff',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
              },
              dark: {
                bg: '#0a0a0a',
                card: '#111111',
                border: '#222222',
                hover: '#1a1a1a',
                text: '#e5e5e5',
                muted: '#737373',
              }
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 200ms ease-out forwards',
              'slide-up': 'slideUp 300ms ease-out forwards',
              'shimmer': 'shimmer 1.5s infinite',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <script>
      // Apply theme before page renders to prevent flash
      // Default to dark mode (skills.sh style)
      (function() {
        const stored = localStorage.getItem('pandabot-store-theme');
        // If explicitly set to light, use light; otherwise default to dark
        if (stored === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          // Default to dark for new users or if preference is dark
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body class="bg-[#FAFAFA] dark:bg-dark-bg text-slate-800 dark:text-dark-text transition-colors duration-200">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
