services:
  - type: web
    name: panda
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: PANDABOT_STATE_DIR
        value: /data/.pandabot
      - key: PANDABOT_WORKSPACE_DIR
        value: /data/workspace
      - key: PANDABOT_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: panda-data
      mountPath: /data
      sizeGB: 1
