services:
  panda-gateway:
    image: ${PANDABOT_IMAGE:-panda:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      PANDABOT_GATEWAY_TOKEN: ${PANDABOT_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${PANDABOT_CONFIG_DIR}:/home/node/.pandabot
      - ${PANDABOT_WORKSPACE_DIR}:/home/node/.panda
    ports:
      - "${PANDABOT_GATEWAY_PORT:-18789}:18789"
      - "${PANDABOT_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${PANDABOT_GATEWAY_BIND:-lan}",
        "--port",
        "${PANDABOT_GATEWAY_PORT:-18789}"
      ]

  panda-cli:
    image: ${PANDABOT_IMAGE:-panda:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${PANDABOT_CONFIG_DIR}:/home/node/.pandabot
      - ${PANDABOT_WORKSPACE_DIR}:/home/node/.panda
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
